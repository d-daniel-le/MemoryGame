<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap">
</head>
<body>
    <div class="container">

        <div class="heading">

            <h1> Memory Game</h1>

        </div>

        <div class="mode">

            <select name="difficulties" id="difficulties">
                
                <option value="Easy" data-value="4" selected>Easy (4x4)</option>
                <option value="Medium" data-value="6">Medium (6x6)</option>
                <option value="Hard" data-value="8">Hard (8x8)</option>

            </select>

            <button class="new-game">New Game</button>

            
            <p class="color">Theme: </p>
            <input type="color" class="color">

        </div>

        <div class="count">

            <p class="moves">Moves: 0</p>

            <p class="timer">Time: 00:00</p>

            <p class="display-total">Total Moves: 0</p>

        </div>

        <div class="game-grid">

        </div>

    </div>
<!-- Audio -->
    <audio id="wrong-answer" src="sound-effects/ES_Alarms, Buzzer, Wrong Answer, Incorrect, Error, Variations 01 - Epidemic Sound - 0000-0199.wav"></audio>
    <audio id="right-answer" src="sound-effects/ES_Notification, Achievement, Response, Positive, Happy, Correct Answer 02 - Epidemic Sound - 0000-1494.wav"></audio>
    <audio id="flip-card" src="sound-effects/ES_Playing Cards, Card, Flip - Epidemic Sound - 0000-1097.wav"></audio>
    <script src="js/script.js"></script>
</body>
</html>
