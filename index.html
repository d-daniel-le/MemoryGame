<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
</head>
<body>
    <div class="container">

        <div class="heading">

            <h1> Memory Game</h1>

        </div>

        <div class="mode">

            <select name="difficulties" id="difficulties">
                
                <option value="Easy">Easy (4x4)</option>
                <option value="Medium">Medium (6x6)</option>
                <option value="Hard">Hard (9x9)</option>

            </select>

        </div>

        <div class="count">

            <p class="moves">Moves: </p>

            <p class="timer">Time: 00:50</p>

        </div>

        <div class="game-grid">

        </div>

    </div>
</body>
</html>
